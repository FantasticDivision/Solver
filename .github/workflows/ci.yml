name: CI

# Runs on every branch push and every pull request targeting main.
on:
  push:
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 1b. The pybind11-based `fitsolver` Python extension module needs
      #     Python development headers/libs, not just an interpreter --
      #     setup-python guarantees those are present (the bare runner
      #     image isn't guaranteed to have them).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 2. Configure the CMake build (Ninja is faster than the default Makefiles)
      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      # 3. Build the project (and the test binary, since tests are added
      #    as a target in CMakeLists.txt)
      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}

      # 4. Run the Google Test suite via CTest
      #    --output-on-failure prints the actual gtest output when something fails,
      #    instead of just "test failed" with no detail.
      - name: Run tests
        working-directory: ${{ github.workspace }}/build
        run: ctest --output-on-failure --build-config ${{ env.BUILD_TYPE }}

      # 5. The gtest suite above only exercises the C++ core -- it never
      #    touches pymodule.cpp, so it can't catch a broken Python
      #    binding (wrong signature, bad conversion, etc). This is the
      #    step that actually imports the compiled module and packs a
      #    real request through it end-to-end.
      - name: Test Python bindings
        run: python tests/test_fitsolver.py

      # Build a separately instrumented copy of the complete core with
      # libFuzzer, AddressSanitizer, and UndefinedBehaviorSanitizer. The
      # time limit keeps this suitable for every push; longer fuzzing can
      # use the same target locally or in a scheduled workflow.
      - name: Configure fuzzer
        run: >
          cmake -S ${{ github.workspace }}
          -B ${{ github.workspace }}/build-fuzz
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DFITSOLVER_BUILD_TESTS=OFF
          -DFITSOLVER_BUILD_PYTHON=OFF
          -DFITSOLVER_BUILD_FUZZER=ON

      - name: Build fuzzer
        run: cmake --build ${{ github.workspace }}/build-fuzz --target fuzz_pack_request

      - name: Prepare fuzzer artifacts
        run: mkdir -p ${{ github.workspace }}/build-fuzz/fuzz-artifacts

      - name: Run fuzzer
        timeout-minutes: 3
        run: >
          ${{ github.workspace }}/build-fuzz/fuzz_pack_request
          ${{ github.workspace }}/tests/fuzz_corpus
          -max_total_time=60
          -max_len=65536
          -artifact_prefix=${{ github.workspace }}/build-fuzz/fuzz-artifacts/
          -print_final_stats=1

      # A crashing input is normally only a few bytes. Preserve it so the
      # failure can be reproduced locally and added to the permanent corpus.
      - name: Upload fuzzer crash input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-pack-request-crash
          path: ${{ github.workspace }}/build-fuzz/fuzz-artifacts/
          if-no-files-found: ignore
