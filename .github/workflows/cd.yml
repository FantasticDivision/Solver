name: CD

# Triggered by the CI workflow finishing on main, NOT independently by
# push -- so this can only ever run against a commit CI has actually
# verified. (A plain `push: branches: [main]` trigger would fire in
# parallel with CI and could publish an image from a commit whose tests
# hadn't passed yet -- or ever -- if branch protection wasn't configured
# to prevent it.) Also runnable manually via workflow_dispatch.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ${{ github.repository }} resolves to e.g. your-org/fitsolver,
  # so the image ends up at ghcr.io/your-org/fitsolver
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Manual runs always proceed; workflow_run-triggered runs only
    # proceed if the CI run that triggered this actually passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    # Needed so this workflow is allowed to push to GHCR using the
    # built-in GITHUB_TOKEN (no extra secret required).
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Build the exact commit CI just verified, not whatever HEAD
          # happens to be by the time this runs (workflow_dispatch has
          # no workflow_run event, so fall back to the triggering commit).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A container reference must be all-lowercase; github.repository
      # ("FantasticDivision/Solver") is not, which makes an explicit
      # `docker push` reject the tag. Lowercase it here rather than rely
      # on any action's implicit handling.
      - name: Resolve lowercase image name
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # Generates sensible tags automatically:
      #   - the short commit SHA, for traceability
      #   - "latest", always pointing at the newest main build
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Plain image, no attestation manifest -- one less thing GHCR
          # can reject on a first publish.
          provenance: false
          cache-from: type=gha
          # A flaky Actions cache service must not fail the deploy.
          cache-to: type=gha,mode=max,ignore-error=true
