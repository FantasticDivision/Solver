name: Wheels

# Builds self-contained fitsolver-client wheels (the ctypes client with
# the native fitsolver_lib vendored inside) for Linux / macOS / Windows.
#
#   Actions -> Wheels -> Run workflow          ->  build only (artifacts)
#   Actions -> Wheels -> Run workflow (TestPyPI checked)  ->  build + upload to TestPyPI
#   git tag v0.1.0 && git push origin v0.1.0   ->  build + publish to PyPI
#
# Publishing uses Trusted Publishing (OIDC) -- no API token. One-time setup:
#   * PyPI  -> Account -> Publishing -> add a pending publisher:
#       project fitsolver-client, owner FantasticDivision, repo Solver,
#       workflow wheels.yml, environment pypi
#   * (optional) TestPyPI -> same, environment testpypi
#   * GitHub repo -> Settings -> Environments -> create "pypi" (+ "testpypi")

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "python/fitsolver_client/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Upload the built wheels to TestPyPI"
        type: boolean
        default: false

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest,  container: "quay.io/pypa/manylinux_2_28_x86_64", plat: manylinux_2_28_x86_64 }
          - { name: macos-x86_64, os: macos-13,        plat: macosx_11_0_x86_64 }
          - { name: macos-arm64,  os: macos-14,        plat: macosx_11_0_arm64 }
          - { name: windows-x64,  os: windows-latest,  plat: win_amd64 }

    steps:
      - uses: actions/checkout@v4

      # The manylinux image ships CPythons under /opt/python but not on
      # PATH; everywhere else use setup-python.
      - name: Select Python (manylinux container)
        if: matrix.container != ''
        run: echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"
      - name: Set up Python
        if: matrix.container == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel
          # manylinux image has GCC but not cmake/ninja; runners have both.
          if [ -n "${{ matrix.container }}" ]; then python -m pip install cmake ninja; fi

      - name: Build fitsolver_lib
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DFITSOLVER_BUILD_TESTS=OFF -DFITSOLVER_BUILD_PYTHON=OFF
          cmake --build build --config Release --target fitsolver_lib

      - name: Vendor the built library into the package
        run: python python/fitsolver_client/tools/vendor_lib.py --build-dir build

      - name: Build wheel
        run: python -m build --wheel python/fitsolver_client --outdir dist_raw

      # build tags the wheel for the build interpreter (cp311-cp311-...).
      # The client is pure ctypes -- no ABI dependency -- so relabel the
      # python/abi part to py3-none. Platform part: set it directly off
      # the runner (mac/windows), or leave it linux_x86_64 for auditwheel
      # to promote to a real manylinux tag.
      - name: Retag py3-none
        run: |
          mkdir -p dist
          if [ -n "${{ matrix.container }}" ]; then
            python -m wheel tags --python-tag py3 --abi-tag none --remove dist_raw/*.whl
          else
            python -m wheel tags --python-tag py3 --abi-tag none \
              --platform-tag "${{ matrix.plat }}" --remove dist_raw/*.whl
          fi
          mv dist_raw/*.whl dist/

      - name: auditwheel repair (Linux)
        if: matrix.container != ''
        run: |
          python -m pip install auditwheel
          auditwheel repair --plat "${{ matrix.plat }}" -w dist_repaired dist/*.whl
          rm dist/*.whl && mv dist_repaired/*.whl dist/

      - name: delocate (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install delocate
          delocate-wheel -v dist/*.whl

      - name: Smoke test the wheel in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/tw"
          PY="$RUNNER_TEMP/tw/bin/python"; [ -x "$PY" ] || PY="$RUNNER_TEMP/tw/Scripts/python"
          "$PY" -m pip install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$PY" - <<'EOF'
          import fitsolver_client as c
          r = c.solve({
            "items": [{"ItemCode": "A", "ItemReference": "x", "Width": 10, "Length": 10, "Depth": 10, "Weight": 0.0}],
            "boxes": [{"Reference": "B", "Width": 100, "Length": 100, "Depth": 100, "MaxWeight": 50.0}],
          })
          assert r["success"], r
          print("ok:", c.__file__)
          EOF

      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build twine
          # Source-only: an sdist has no _libs/, so installing it needs a
          # local build/ or FITSOLVER_LIB_PATH. Wheels are what consumers
          # depend on; the sdist is here for completeness / `pip download`.
          python -m build --sdist python/fitsolver_client --outdir dist
          python -m twine check dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-testpypi:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
