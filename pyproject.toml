[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=3.0.4"
]
build-backend = "scikit_build_core.build"

[project]
name = "FantasticFitSolver"
version = "0.1.5"
readme = "README.md"
description = "Fantastic group's FitSolver implementation."
requires-python = ">=3.13.2"

[project.urls]
Homepage = "https://github.com/FantasticDivision/Solver"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
FITSOLVER_BUILD_TESTS = "OFF"
FITSOLVER_BUILD_PYTHON = "ON"